<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option Trader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="banner" class="banner">Loading…</div>
<div id="halt" class="halt hidden"></div>
<main>
  <section class="card" id="new-trade">
    <h2>New trade</h2>
    <form id="form" autocomplete="off">
      <div class="grid">
        <label>Instrument <select name="underlying" id="underlying"></select></label>
        <label>Expiry <select name="expiry" id="expiry"></select></label>
        <label>Strike <select name="strike" id="strike"></select></label>
        <label>Option <select name="option_type"><option>CE</option><option>PE</option></select></label>
        <label>Side
          <span class="seg"><input type="radio" name="side" value="BUY" id="sbuy" checked><label for="sbuy" class="buy">BUY</label>
          <input type="radio" name="side" value="SELL" id="ssell"><label for="ssell" class="sell">SELL</label></span>
        </label>
        <label>Product <select name="product" id="product"><option>MIS</option><option>NRML</option></select></label>
        <label>Lots <input name="lots" type="number" min="1" step="1" value="1" required></label>
        <label>Quantity <output id="qty">–</output></label>
        <label>Entry limit ₹ <input name="entry_price" type="number" step="0.05" min="0.05" required></label>
        <label>Stop-loss ₹ <input name="stop_loss" type="number" step="0.05" min="0.05" required></label>
        <label>Target ₹ <input name="target" type="number" step="0.05" min="0.05"></label>
        <label>LTP (Breeze) <span><output id="ltp">–</output> <button type="button" id="get-ltp" title="one Breeze call">Get LTP</button></span></label>
      </div>
      <fieldset>
        <legend><label><input type="checkbox" name="trail_enabled" id="trail_enabled"> Trailing stop-loss</label></legend>
        <div class="grid opt" id="trail_opts">
          <label>Type <select name="trail_type"><option value="POINTS">Points</option><option value="PERCENT">Percent</option></select></label>
          <label>Trail by <input name="trail_value" type="number" step="0.05" min="0"></label>
          <label>Min step (₹) <input name="trail_step" type="number" step="0.05" min="0" placeholder="1 tick"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend><label><input type="checkbox" name="partial_enabled" id="partial_enabled"> Partial booking</label></legend>
        <div class="grid opt" id="partial_opts">
          <label>Lots to book <input name="partial_lots" type="number" min="1" step="1"></label>
          <label>At price ₹ <input name="partial_price" type="number" step="0.05" min="0.05"></label>
        </div>
      </fieldset>
      <div class="grid">
        <label>Auto-exit time (optional) <input name="auto_exit_time" type="time"></label>
      </div>
      <p id="form-hint" class="hint"></p>
      <button type="submit" id="preview-btn">Review trade…</button>
    </form>
    <div id="paper-price" class="hidden">
      <h3>Paper price (manual quotes)</h3>
      <input id="pp-symbol" placeholder="tradingsymbol"> <input id="pp-price" type="number" step="0.05" placeholder="price">
      <button id="pp-set" type="button">Set LTP</button>
    </div>
  </section>

  <section class="card">
    <h2>System status</h2>
    <div id="system" class="system"></div>
  </section>

  <section class="card wide">
    <h2>Active trades</h2>
    <table id="active"><thead><tr>
      <th>#</th><th>Instrument</th><th>Side</th><th>Entry</th><th>LTP</th><th>SL</th><th>Target</th><th>Qty</th>
      <th>Filled</th><th>P&amp;L</th><th>P&amp;L %</th><th>Status</th><th>Entry time</th><th>Updated</th><th></th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section class="card wide">
    <h2>Completed trades</h2>
    <table id="completed"><thead><tr>
      <th>#</th><th>Instrument</th><th>Side</th><th>Entry</th><th>Exit</th><th>Qty</th><th>P&amp;L</th>
      <th>Exit reason</th><th>Duration</th><th>Status</th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section class="card wide hidden" id="detail">
    <h2 id="detail-title"></h2>
    <div id="detail-body"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <p id="dlg-live" class="live-confirm hidden">● LIVE: this sends a real order to Zerodha.</p>
    <menu><button value="cancel" id="dlg-cancel">Cancel</button> <button value="ok" id="dlg-ok" class="danger">Confirm</button></menu>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
